<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新零帮调度看板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f0f2f5; color:#1f2329; padding-bottom:40px; }
  header { background:#fff; border-bottom:1px solid #e5e6eb; padding:12px 24px; position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:12px; box-shadow:0 1px 4px rgba(0,0,0,.04); flex-wrap:wrap; }
  header h1 { font-size:18px; }
  #update-time { font-size:12px; color:#86909c; flex:1; min-width:180px; }
  .btn { border:none; border-radius:6px; padding:8px 16px; font-size:13px; cursor:pointer; color:#fff; background:#165dff; transition:.15s; }
  .btn:hover { background:#4080ff; }
  .btn:disabled { background:#a9c3ff; cursor:not-allowed; }
  .btn.mini { padding:5px 12px; font-size:12px; }
  .btn.refresh-all { background:#00b578; }
  .btn.refresh-all:hover { background:#23c082; }
  main { width:100%; margin:16px auto 0; padding:0 16px; }
  .card { background:#fff; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); overflow:hidden; }
  .card-head { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid #f0f0f0; flex-wrap:wrap; }
  .card-head h2 { font-size:15px; }
  .card-head .sub { font-size:12px; color:#86909c; flex:1; }
  .sum-row { display:flex; gap:10px; flex-wrap:wrap; padding:12px 20px; border-bottom:1px solid #f0f0f0; background:#fafbfc; }
  .sum-item { background:#fff; border:1px solid #f0f0f0; border-radius:6px; padding:5px 12px; font-size:12px; color:#4e5969; }
  .sum-item b { font-size:16px; margin-right:4px; }
  .card-body { padding:10px 20px 20px; font-size:13px; }
  .empty { color:#86909c; padding:20px 0; text-align:center; }
  details.group { border:1px solid #f0f0f0; border-radius:8px; margin-top:10px; overflow:hidden; }
  details.group summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:9px 14px; background:#fafbfc; font-size:13px; user-select:none; }
  details.group summary::-webkit-details-marker { display:none; }
  details.group summary .arrow { transition:.2s; color:#86909c; font-size:11px; }
  details.group[open] summary .arrow { transform:rotate(90deg); }
  details.group summary:hover { background:#f2f3f5; }
  .driver-cell b { font-size:13px; }
  .driver-cell b.loading { color:#00B050; }
  .driver-cell span { font-size:11px; color:#86909c; margin-left:8px; }
  .carrier-edit { font-size:11px; color:#86909c; margin-left:8px; width:88px; padding:2px 6px; border:1px solid transparent; border-radius:5px; background:transparent; outline:none; }
  .carrier-edit:hover { border-color:#e5e6eb; background:#fff; }
  .carrier-edit:focus { border-color:#165dff; background:#fff; color:#1f2329; }
  .g-cnt { font-size:11px; color:#165dff; background:#e8f3ff; border-radius:10px; padding:1px 8px; }
  .g-none { font-size:11px; color:#c9cdd4; }
  /* 无托盘状态信息的分组：折起且不可展开 */
  details.group.no-pallet summary { cursor:default; background:#fbfbfc; }
  details.group.no-pallet summary:hover { background:#fbfbfc; }
  details.group.no-pallet .arrow { color:#d9dde3; }
  details.group.no-pallet summary b { color:#86909c; }
  table { border-collapse:collapse; width:100%; table-layout:fixed; }
  th,td { border-top:1px solid #f2f3f5; padding:6px 14px; text-align:left; font-size:12.5px; vertical-align:top; overflow-wrap:break-word; }
  th { color:#4e5969; font-weight:600; background:#fff; }
  th.c,td.c { text-align:center; }
  col.w-store { width:300px; }
  col.w-wait { width:100px; }
  col.w-chan { width:90px; }
  .cnt { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:20px; padding:0 7px; border-radius:10px; background:#00b578; color:#fff; font-size:12px; font-weight:600; }
  .cnt.zero { background:#e5e6eb; color:#86909c; font-weight:400; }
  td.wait-hot { background:#fffbe6; }
  .channel { font-weight:600; color:#165dff; white-space:nowrap; }
  .chan-share { display:inline-block; margin-left:3px; padding:0 4px; border-radius:8px; font-size:10.5px; font-weight:600; color:#fff; background:#ff7d00; white-space:nowrap; }
  .pallet { display:inline-block; margin:1px 4px 1px 0; padding:2px 7px; border-radius:4px; font-size:12px; background:#f2f3f5; }
  .pallet.s-DOING { color:#0070C0; background:#e8f1fb; }
  .pallet.s-FINISH { color:#FF0000; background:#fdecec; }
  .pallet.s-CHECKED { color:#d48806; background:#fff7e6; }
  .pallet.s-LOADING { color:#00B050; background:#e8f7ef; }
  .loaded { color:#86909c; font-size:12px; }
  .rush-btn { margin-left:10px; padding:1px 8px; font-size:11px; border:none; border-radius:9px; background:#ff7d00; color:#fff; cursor:pointer; vertical-align:1px; }
  .rush-btn:hover { background:#ff9a2e; }
  .rush-btn:disabled { background:#c9cdd4; cursor:default; }
  .copy-btn { margin-left:6px; padding:1px 8px; font-size:11px; border:none; border-radius:9px; background:#165dff; color:#fff; cursor:pointer; vertical-align:1px; }
  .copy-btn:hover { background:#4080ff; }
  .copy-btn.ok { background:#00b578; }
  .depart-btn { margin-left:6px; padding:1px 8px; font-size:11px; border:none; border-radius:9px; background:#00b578; color:#fff; cursor:pointer; vertical-align:1px; }
  .depart-btn:hover { background:#23c082; }
  .depart-btn:disabled { background:#c9cdd4; cursor:default; }
  .route-btn { margin-left:6px; padding:1px 8px; font-size:11px; border:none; border-radius:9px; background:#722ed1; color:#fff; cursor:pointer; vertical-align:1px; }
  .route-btn:hover { background:#8b3fe8; }
  .route-btn:disabled { background:#c9cdd4; cursor:default; }
  /* ---- 左侧页签 ---- */
  .layout { display:flex; align-items:flex-start; }
  .tabs { position:sticky; width:118px; flex-shrink:0; display:flex; flex-direction:column; align-items:stretch; gap:6px; padding:16px 10px; background:#fff; border-right:1px solid #e5e6eb; height:calc(100vh - 60px); overflow-y:auto; z-index:5; }
  .tab { border:1px solid #e5e6eb; background:#fff; color:#4e5969; padding:10px 12px; border-radius:8px; font-size:13.5px; cursor:pointer; text-align:left; white-space:nowrap; }
  .tab:hover { background:#f2f3f5; }
  .tab.active { background:#165dff; border-color:#165dff; color:#fff; font-weight:600; }
  .tab.active:hover { background:#4080ff; }
  .content { flex:1; min-width:0; }
  .pallet-toggle { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:#4e5969; cursor:pointer; user-select:none; white-space:nowrap; }
  .pallet-toggle input { width:15px; height:15px; accent-color:#165dff; cursor:pointer; }
  /* ---- 司机分类页 ---- */
  .drv-table { width:100%; border-collapse:collapse; }
  .drv-table th, .drv-table td { padding:9px 12px; border-bottom:1px solid #f2f3f5; text-align:left; font-size:13.5px; }
  .drv-table th { color:#86909c; font-weight:500; font-size:12.5px; background:#f7f8fa; }
  .drv-table tr:last-child td { border-bottom:none; }
  .drv-radio { display:inline-flex; align-items:center; gap:5px; cursor:pointer; user-select:none; font-size:13px; }
  .drv-radio input { width:16px; height:16px; accent-color:#ff7d00; cursor:pointer; }
  .drv-badge { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:9px; font-size:11px; background:#fff3e8; color:#ff7d00; font-weight:600; }
  .drv-date { color:#86909c; font-size:12px; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:14px; }
  .modal-bg.show { display:flex; }
  .modal { background:#fff; border-radius:10px; width:min(560px,100%); max-height:88vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.2); }
  .modal h3 { font-size:15px; padding:13px 16px; border-bottom:1px solid #f0f0f0; }
  .modal .meta { font-size:12px; color:#86909c; padding:9px 16px 0; }
  .modal textarea { flex:1; margin:10px 16px; padding:10px; border:1px solid #e5e6eb; border-radius:6px; font-family:inherit; font-size:13px; line-height:1.65; min-height:300px; resize:none; color:#1f2329; background:#fafbfc; }
  .modal .foot { display:flex; gap:8px; justify-content:flex-end; padding:0 16px 14px; }
  .modal .btn.gray { background:#86909c; }
  .modal .btn.gray:hover { background:#a3aab4; }
  details.log { margin-top:16px; background:#fff; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); padding:12px 20px; }
  details.log summary { font-size:12px; color:#165dff; cursor:pointer; }
  details.log pre { background:#f7f8fa; border-radius:6px; padding:10px; font-size:11px; line-height:1.5; white-space:pre-wrap; max-height:220px; overflow:auto; margin-top:6px; color:#4e5969; }
  .spin { display:inline-block; width:12px; height:12px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:r .7s linear infinite; vertical-align:-2px; margin-right:5px; }
  @keyframes r { to { transform:rotate(360deg); } }

  /* ---- 手机适配（<=640px） ---- */
  @media (max-width: 640px) {
    body { padding-bottom:24px; }
    header { padding:10px 12px; gap:8px; }
    header h1 { font-size:16px; width:100%; }
    #update-time { font-size:11px; min-width:0; width:100%; order:3; }
    header label { font-size:12px !important; margin-left:auto; }
    header select { padding:8px 10px !important; font-size:13px !important; }
    .btn.mini { padding:10px 12px; font-size:13px; }
    .btn.refresh-all { padding:10px 14px; }
    main { padding:0 8px; margin-top:10px; }
    .layout { display:block; }
    .tabs { position:sticky; top:0; width:100%; height:auto !important; overflow:visible; flex-direction:row; gap:8px; padding:8px 10px; border-right:none; border-bottom:1px solid #e5e6eb; box-shadow:0 2px 6px rgba(0,0,0,.05); }
    .tab { flex:1; padding:10px 8px; font-size:13px; text-align:center; border-radius:8px; }
    .card-head { padding:10px 12px; }
    .card-head h2 { font-size:14px; }
    .card-head .sub { font-size:11px; }
    .sum-row { padding:8px 10px; gap:6px; }
    .sum-item { padding:4px 8px; font-size:11px; border-radius:5px; }
    .sum-item b { font-size:14px; }
    .card-body { padding:6px 10px 14px; font-size:12.5px; }
    details.group summary { padding:10px 10px; }
    .driver-cell span { margin-left:5px; }
    col.w-store { width:34%; }
    col.w-wait { width:58px; }
    col.w-chan { width:64px; }
    th,td { padding:6px 6px; font-size:12px; }
    th:nth-child(4), td:nth-child(4) { word-break:break-all; }
    /* 表头不竖排：表格窄屏内横向滚动，列宽保底 */
    details table { display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; min-width:100%; }
    details table th { white-space:nowrap; }
    details table col.w-store { width:130px; min-width:130px; }
    details table col.w-wait { width:64px; min-width:64px; }
    details table col.w-chan { width:72px; min-width:72px; }
    details table td:nth-child(4) { min-width:150px; }
    .pallet { padding:2px 5px; font-size:11px; margin:1px 2px 1px 0; }
    .cnt { min-width:20px; height:19px; font-size:11px; padding:0 5px; }
    .channel { font-size:11.5px; }
    details.log { margin-top:12px; padding:10px 12px; }
  }
  /* 超窄屏（<=380px）：列宽再收紧一点，其余靠横向滚动 */
  @media (max-width: 380px) {
    details table col.w-store { width:110px; min-width:110px; }
    details table col.w-chan { width:60px; min-width:60px; }
    .sum-item { padding:3px 6px; font-size:10px; }
    .sum-item b { font-size:13px; }
  }
</style>
</head>
<body>
<header>
  <h1>🚚 新零帮调度看板</h1>
  <span id="update-time">加载中…</span>
  <label style="font-size:12.5px;color:#4e5969;display:flex;align-items:center;gap:6px;">供应商
    <select id="carrier-sel" onchange="runTask('1')" style="padding:5px 8px;border:1px solid #e5e6eb;border-radius:6px;font-size:12.5px;background:#fff;cursor:pointer;">
      <option value="all">全部供应商</option>
      <option value="6666600000863" selected>当涂云顺</option>
      <option value="6666600000749">当涂日日顺</option>
      <option value="6666600000114">当涂逍蜂</option>
      <option value="6666600000115">当涂原赫</option>
    </select>
  </label>
  <button class="btn mini" id="btn-1" onclick="runTask('1')">任务更新</button>
  <button class="btn mini" id="btn-2" onclick="runTask('2')">待拣更新</button>
  <button class="btn mini" id="btn-3" onclick="runTask('3')">集货位更新</button>
  <button class="btn refresh-all" id="btn-all" onclick="runTask('all')">⟳ 待拣+集货更新</button>
</header>
<div class="layout">
<nav class="tabs">
  <button class="tab active" id="tab-board" onclick="switchTab('board')">📋 调度看板</button>
  <button class="tab" id="tab-drivers" onclick="switchTab('drivers')">🚛 司机分类</button>
</nav>
<div class="content">
<main id="page-board">
  <section class="card">
    <div class="card-head">
      <h2>调度列表</h2>
      <span class="sub" id="sub-main"></span>
      <label class="pallet-toggle" title="勾选后显示托盘车司机（司机分类页中未标记「零散」的司机）；默认只显示零散司机">
        <input type="checkbox" id="show-pallet-chk" onchange="if(LAST)render(LAST)">显示托盘车司机
      </label>
    </div>
    <div class="sum-row" id="sum-row"></div>
    <div class="card-body" id="body-main"><div class="empty">暂无数据，点击「全部更新」获取</div></div>
  </section>

  <details class="log" id="log-box" style="display:none;">
    <summary>执行日志</summary>
    <pre id="log-pre"></pre>
  </details>
</main>
<main id="page-drivers" style="display:none">
  <section class="card">
    <div class="card-head">
      <h2>司机分类</h2>
      <span class="sub" id="drv-sub">加载中…</span>
    </div>
    <div class="card-body" id="drv-body"><div class="empty">加载中…</div></div>
  </section>
</main>
</div>
</div>
<div class="modal-bg" id="depart-modal" onclick="if(event.target===this)closeDepartModal()">
  <div class="modal">
    <h3 id="depart-title">发车信息</h3>
    <div class="meta" id="depart-meta"></div>
    <textarea id="depart-text" readonly spellcheck="false"></textarea>
    <div class="foot">
      <button class="btn mini" onclick="copyDepartText(this)">复制</button>
      <button class="btn mini gray" onclick="closeDepartModal()">关闭</button>
    </div>
  </div>
</div>
<script>
const ST_CN = {'DOING':'已排计划','FINISH':'拣货完成','CHECKED':'已质检','LOADING':'装车中'};
let running = false;
let LAST = null;

function fmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts*1000);
  const p = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 劳务名称手动覆盖：按司机名记在 localStorage，改完立即保存并显示
let CARRIER_OVR = {};
try{ CARRIER_OVR = JSON.parse(localStorage.getItem('xlb_carrier_ovr')||'{}'); }catch(e){ CARRIER_OVR = {}; }
function saveCarrier(input, driver){
  const v = input.value.trim();
  if(v) CARRIER_OVR[driver] = v; else delete CARRIER_OVR[driver];
  try{ localStorage.setItem('xlb_carrier_ovr', JSON.stringify(CARRIER_OVR)); }catch(e){}
}
function carrierOf(g){
  return CARRIER_OVR[g.driver] || g.carrier || '';
}

function find2(counts, name){
  if(counts[name] !== undefined) return {n: counts[name], hit: name};
  for(const k in counts){ if(k && (name.includes(k) || k.includes(name))) return {n: counts[k], hit: k}; }
  return null;
}
function find3(stores, name){
  if(stores[name]) return {e: stores[name], hit: name};
  for(const k in stores){ if(k && (name.includes(k) || k.includes(name))) return {e: stores[k], hit: k}; }
  return null;
}

function render(data){
  LAST = data;
  const t1 = data['1'], t2 = data['2'], t3 = data['3'];
  const times = [];
  for(const t of ['1','2','3']) if(data[t] && data[t].ts) times.push(fmtTime(data[t].ts));
  document.getElementById('update-time').textContent =
    (times.length ? `最近更新：${times.join(' / ')}` : '尚未获取数据');

  // ---- 汇总条 ----
  let sumHtml = '';
  if(t1) sumHtml += `<span class="sum-item"><b>${t1.total}</b>已调度${esc(t1.date)}（单${t1.carrier?' · '+esc(t1.carrier):''}）</span>`;
  let counts = {}, stores = {}, fids0 = {};
  if(t2){ counts = t2.counts || {}; fids0 = t2.fids0 || {}; }
  if(t3) stores = t3.stores || {};
  const nonzero = Object.values(counts).filter(v=>v>0).length;
  // 通道共用统计：同一通道被几家门店占用（多店=多司机分属不同组，2026-09-26）
  const chanShare = {};
  for(const k in stores){ const ch=stores[k].channel||''; if(!ch) continue; (chanShare[ch]=chanShare[ch]||new Set()).add(k); }
  sumHtml += `<span class="sum-item"><b style="color:${nonzero?'#ff7d00':'#00b578'}">${Object.values(counts).reduce((a,b)=>a+b,0)}</b>待拣货（条/ ${nonzero}店）</span>`;
  const stCnt = {'DOING':0,'FINISH':0,'CHECKED':0,'LOADING':0};
  let palletTotal = 0;
  for(const k in stores) for(const p of stores[k].pallets){ stCnt[p.state] = (stCnt[p.state]||0)+1; palletTotal++; }
  sumHtml += `<span class="sum-item"><b>${Object.keys(stores).length}</b>在场门店</span>`
    + `<span class="sum-item"><b class="st-已排计划" style="font-size:16px">${stCnt.DOING||0}</b>已排计划</span>`
    + `<span class="sum-item"><b class="st-拣货完成" style="font-size:16px">${stCnt.FINISH||0}</b>拣货完成</span>`
    + `<span class="sum-item"><b class="st-已质检" style="font-size:16px">${stCnt.CHECKED||0}</b>已质检</span>`
    + `<span class="sum-item"><b class="st-装车中" style="font-size:16px">${stCnt.LOADING||0}</b>装车中</span>`;
  document.getElementById('sum-row').innerHTML = sumHtml;

  const subMain = document.getElementById('sub-main');
  const body = document.getElementById('body-main');
  if(!t1 && !t2 && !t3){ body.innerHTML = '<div class="empty">暂无数据，点击「全部更新」获取</div>'; return; }

  // 已被任务1门店消费掉的 t2/t3 名单，剩余归入"其他门店"组
  const used2 = new Set(), used3 = new Set();

  const storeRow = (name) => {
    const w = find2(counts, name); if(w) used2.add(w.hit);
    const s = find3(stores, name); if(s) used3.add(s.hit);
    let palletCell, chanCell;
    if(s){
      const shareN = (chanShare[s.e.channel]||new Set()).size;
      chanCell = `<span class="channel">${esc(s.e.channel)}</span>` + (shareN>1?`<span class="chan-share" title="此通道由${shareN}家门店共用，可能分属不同司机">${shareN}店共用</span>`:'');
      palletCell = s.e.pallets.map(p=>`<span class="pallet s-${p.state}" title="${esc(p.channel)}">${esc(p.text)}</span>`).join('') || '<span class="loaded">-</span>';
    } else { chanCell = '<span class="loaded">-</span>'; palletCell = '<span class="loaded">-</span>'; }
    const n = w ? w.n : null;
    // 加急按钮：待拣>0 且存在 priority=0（未加急）的待拣单
    let n0 = 0;
    if(w && fids0[w.hit]) n0 = fids0[w.hit].length;
    else if(w){ for(const k in fids0){ if(k && (k.includes(name) || name.includes(k))) n0 += fids0[k].length; } }
    const rush = (n && n>0 && n0>0) ? `<button class="rush-btn" data-store="${esc(name)}" onclick="rushStore(this)" title="将该门店 ${n0} 条未加急的待拣订单加急">加急</button>` : '';
    return `<tr class="${n&&n>0?'wait-hot':''}"><td>${esc(name)}${rush}</td>`
      + `<td class="c">${n===null?'<span class="loaded">-</span>':`<span class="cnt ${n?'':'zero'}">${n}</span>`}</td>`
      + `<td>${chanCell}</td><td>${palletCell}</td></tr>`;
  };

  let html = '';
  const groups = (t1 && t1.groups) || [];
  // 司机分类过滤：默认只显示「零散」司机，托盘车司机（未标记零散）不显示；勾选「显示托盘车司机」看全部
  const showPallet = document.getElementById('show-pallet-chk').checked;
  const knownN = Object.keys(DRIVERS).length;
  let shownDrv = 0;
  groups.forEach((g, gi) => {
    const d = DRIVERS[g.driver];
    const isScattered = d ? !!d.scattered : (knownN === 0);  // 司机名单未加载到时兜底全显示
    if(!showPallet && !isScattered) return;
    shownDrv++;
    // 名下门店全都没有托盘状态信息（任务3未收录）→ 默认折起且禁止展开
    const hasPallet = g.stores.some(n => { const s = find3(stores, n); return s && s.e.pallets && s.e.pallets.length; });
    // 名下门店存在「装车中」托盘 → 司机姓名显示绿色
    const loadingN = g.stores.reduce((a,n) => { const s = find3(stores, n);
      return a + (s && s.e.pallets ? s.e.pallets.filter(p=>p.state==='LOADING').length : 0); }, 0);
    const rows = g.stores.map(storeRow).join('');
    html += `<details class="group${hasPallet?'':' no-pallet'}"${hasPallet?' open':''}>
      <summary onclick="if(this.parentNode.classList.contains('no-pallet')){event.preventDefault();}">
      <span class="arrow">▶</span>
      <span class="driver-cell"><b class="${loadingN?'loading':''}"${loadingN?` title="该司机当前有 ${loadingN} 托装车中"`:''}>${esc(g.driver)||'(未知司机)'}</b><input class="carrier-edit" value="${esc(carrierOf(g))}" placeholder="劳务名称" title="点击可编辑劳务名称，修改后自动保存" onclick="event.preventDefault();event.stopPropagation();" onkeydown="event.stopPropagation();" onchange="saveCarrier(this,'${esc(g.driver).replace(/'/g,"\\'")}');this.blur()"></span>
      <span class="g-cnt">${g.stores.length} 店</span>
      <button class="copy-btn" data-gi="${gi}" onclick="copyStores(this);event.preventDefault();event.stopPropagation();" title="复制该司机名下门店列表，用于发送给司机">复制门店</button>
      <button class="route-btn" data-driver="${esc(g.driver)}" onclick="storeRoute(this);event.preventDefault();event.stopPropagation();" title="按从马鞍山顺丰丰泰产业园出发的货车最优路线排序该司机名下门店">门店排序</button>
      <button class="depart-btn" data-driver="${esc(g.driver)}" onclick="departInfo(this);event.preventDefault();event.stopPropagation();" title="查询该司机当天运输中订单，生成发车信息">发车信息</button>
      ${hasPallet?'':'<span class="g-none" title="该司机名下门店暂无集货托盘状态，卡片已折起且不可展开">无托盘信息</span>'}
      </summary>
      <table><colgroup><col class="w-store"><col class="w-wait"><col class="w-chan"><col></colgroup><tr><th>门店</th><th class="c">待拣/条</th><th>通道</th><th>托盘状态</th></tr>${rows}</table>
    </details>`;
  });
  // 其他门店：出现在任务2/3但不在任务1列表的
  const extra = [];
  for(const k in stores) if(!used3.has(k)) extra.push(k);
  for(const k in counts) if(!used2.has(k) && !extra.includes(k)) extra.push(k);
  if(extra.length){
    const rows = extra.map(storeRow).join('');
    html += `<details class="group"><summary>
      <span class="arrow">▶</span>
      <span class="driver-cell"><b>其他门店</b><span>不在任务1列表中</span></span>
      <span class="g-cnt">${extra.length} 店</span>
      </summary>
      <table><colgroup><col class="w-store"><col class="w-wait"><col class="w-chan"><col></colgroup><tr><th>门店</th><th class="c">待拣/条</th><th>通道</th><th>托盘状态</th></tr>${rows}</table>
    </details>`;
  }
  body.innerHTML = html || '<div class="empty">暂无门店数据</div>';

  let sub = [];
  if(t1){
    const hiddenN = groups.length - shownDrv;
    sub.push(`任务1：${t1.total} 单 / ${groups.length} 条记录` + (hiddenN>0 ? `（已隐藏 ${hiddenN} 位托盘车司机）` : ''));
  }
  sub.push(`任务2：${nonzero} 家门店有待拣`);
  sub.push(`任务3：${palletTotal} 托`);
  subMain.textContent = sub.join(' · ');
}

let STATIC_MODE = false;   // Pages 静态镜像：读仓库快照展示；更新按钮经隧道转发本机执行
let LIVE_URL = '';
let DRIVERS = {};          // 司机分类名单：{ 司机名: {scattered,...} }，用于调度看板过滤托盘车司机

// 拉取司机分类名单（不刷新司机分类页 UI）
async function fetchDriversMap(){
  try{
    const base = STATIC_MODE ? await ensureTunnel() : '';
    if(STATIC_MODE && !base) return;
    const r = await fetch(base + '/api/drivers');
    const j = await r.json();
    if(j.ok && Array.isArray(j.drivers)){
      DRIVERS = {};
      j.drivers.forEach(d => { DRIVERS[d.name] = d; });
    }
  }catch(e){ /* 拉取失败时保留旧名单，render 兜底全显示 */ }
}

// 读取本机隧道入口（tunnel_url.js 只存在于 Pages 仓库）
fetch('tunnel_url.js?t='+Date.now()).then(r=>r.ok?r.text():'').then(t=>{
  const m = t && t.match(/https:\/\/[a-z0-9-]+\.trycloudflare\.com/);
  if(m) LIVE_URL = m[0];
}).catch(()=>{});

async function load(){
  try{
    const r = await fetch('/api/data');
    if(r.ok){ const j = await r.json(); render(j.data); return; }
    throw new Error('api '+r.status);
  }catch(e){
    // 静态站回退：读同目录快照 JSON（GitHub Actions 每5分钟更新）
    STATIC_MODE = true;
    try{
      const q = async f => { const r = await fetch(f+'?t='+Date.now()); return r.ok ? await r.json() : null; };
      const [a,b,c] = await Promise.all([q('data_task1.json'), q('data_task2.json'), q('data_task3.json')]);
      const d = {};
      if(a) d['1']=a; if(b) d['2']=b; if(c) d['3']=c;
      render(d);
      if(!a&&!b&&!c) document.getElementById('update-time').textContent = '快照数据不可用';
    }catch(e2){
      document.getElementById('update-time').textContent = '加载失败: '+e2;
    }
  }
}

async function ensureTunnel(){
  // 惰性兜底：页面加载时的隧道探测可能因网络抖动失败，点更新时再试一次
  if(LIVE_URL) return LIVE_URL;
  if(!STATIC_MODE) return '';
  try{
    const t = await fetch('tunnel_url.js?t='+Date.now()).then(r=>r.ok?r.text():'');
    const m = t && t.match(/https:\/\/[a-z0-9-]+\.trycloudflare\.com/);
    if(m) LIVE_URL = m[0];
  }catch(e){}
  return LIVE_URL;
}

// 门店待拣订单加急：服务端按任务2快照里的 fid 批量调 addpriority，成功后 2 秒自动刷新待拣
async function rushStore(btn){
  const store = btn.dataset.store;
  if(!store || btn.disabled) return;
  const base = STATIC_MODE ? await ensureTunnel() : '';
  if(STATIC_MODE && !base){ alert('隧道入口未就绪，暂时无法加急。'); return; }
  const old = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '…';
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 60000);
    const r = await fetch(base + '/api/priority?store=' + encodeURIComponent(store),
      {method:'POST', signal: ctrl.signal}).finally(()=>clearTimeout(timer));
    const j = await r.json();
    if(j.ok){
      btn.innerHTML = '已加急✓';
      setTimeout(()=>runTask('2'), 2000);   // 2 秒后刷新待拣数据
    }else{
      btn.innerHTML = old; btn.disabled = false;
      alert('加急失败：' + (j.msg || '未知错误'));
    }
  }catch(e){
    const detail = (e && e.name === 'AbortError') ? '请求超时' : ((e && e.message) || String(e));
    btn.innerHTML = old; btn.disabled = false;
    alert('加急请求失败：' + detail);
  }
}

// 复制单个门店名称（门店旁小按钮）
// 复制司机名下门店列表：优先 clipboard API，局域网 http 环境降级 execCommand
function copyStores(btn){
  const gi = +btn.dataset.gi;
  const g = LAST && LAST['1'] && LAST['1'].groups && LAST['1'].groups[gi];
  if(!g || !g.stores || !g.stores.length){ alert('未找到该司机名下门店数据'); return; }
  const text = g.stores.join('\n\n');
  copyText(text, btn, '复制门店');
}
function copyText(text, btn, oldLabel){
  const done = () => {
    btn.textContent = '已复制✓'; btn.classList.add('ok'); btn.disabled = true;
    setTimeout(()=>{ btn.textContent = oldLabel; btn.classList.remove('ok'); btn.disabled = false; }, 1500);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{
    if(document.execCommand('copy')){ done(); }
    else{ throw new Error('copy 命令失败'); }
  }catch(e){
    alert('复制失败，请手动选择复制：\n\n' + text);
  }finally{
    document.body.removeChild(ta);
  }
}

// 发车信息：查该司机当天运输中订单 → 弹窗展示可复制文本
// ---- 页签切换与司机分类 ----
// 页签吸顶：top 与高度都跟随 header 实际高度（header 会换行变高）
// 手机端页签为顶部横条，同样吸在 header 下方（否则会被 sticky header 盖住）
function fitTabs(){
  const t = document.querySelector('.tabs');
  if(!t) return;
  const h = document.querySelector('header').offsetHeight;
  t.style.top = h + 'px';
  if(window.innerWidth > 640){
    t.style.height = 'calc(100vh - ' + h + 'px)';
  } else {
    t.style.height = 'auto';
  }
}
window.addEventListener('resize', fitTabs);
window.addEventListener('load', fitTabs);
fitTabs();
function switchTab(pg){
  document.getElementById('tab-board').classList.toggle('active', pg==='board');
  document.getElementById('tab-drivers').classList.toggle('active', pg==='drivers');
  document.getElementById('page-board').style.display = pg==='board' ? '' : 'none';
  document.getElementById('page-drivers').style.display = pg==='drivers' ? '' : 'none';
  if(pg==='drivers') loadDrivers();
  if(pg==='board' && LAST) fetchDriversMap().then(()=>render(LAST));
}
async function loadDrivers(){
  const base = STATIC_MODE ? await ensureTunnel() : '';
  const body = document.getElementById('drv-body');
  if(STATIC_MODE && !base){ body.innerHTML = '<div class="empty">隧道入口未就绪，暂时无法加载。</div>'; return; }
  try{
    const r = await fetch(base + '/api/drivers');
    const j = await r.json();
    if(!j.ok) throw new Error('bad response');
    renderDrivers(j);
  }catch(e){
    body.innerHTML = '<div class="empty">加载失败，请稍后重试</div>';
  }
}
function renderDrivers(j){
  const list = j.drivers || [];
  const sc = list.filter(d=>d.scattered).length;
  document.getElementById('drv-sub').textContent =
    `共 ${list.length} 人 · 托盘车 ${list.length-sc} · 零散 ${sc}`;
  const body = document.getElementById('drv-body');
  if(!list.length){
    body.innerHTML = '<div class="empty">暂无司机记录，点「任务更新」后自动记录</div>';
    return;
  }
  const rows = list.map(d => {
    const on = d.scattered ? ' checked' : '';
    const badge = d.scattered
      ? '<span class="drv-badge">零散</span>'
      : '<span class="drv-badge" style="background:#e8f3ff;color:#165dff">托盘车</span>';
    const last = d.last_seen===j.today ? '今天' : (d.last_seen||'');
    return `<tr>
      <td><span class="drv-name">${esc(d.name)}</span>
        <label class="drv-radio" style="margin-left:10px"><input type="radio" name="drv-${esc(d.name)}"${on} data-on="${d.scattered?1:0}" onclick="toggleScatter(this,'${esc(d.name)}')">零散</label></td>
      <td>${badge}</td>
      <td class="drv-date">${last}</td>
    </tr>`;
  }).join('');
  body.innerHTML = `<table class="drv-table"><thead><tr><th>司机</th><th>标记</th><th>最后更新</th></tr></thead><tbody>${rows}</tbody></table>`;
}
async function toggleScatter(r, name){
  const now = r.dataset.on !== '1';   // 再点一次取消
  r.dataset.on = now ? '1' : '0';
  r.checked = now;
  const base = STATIC_MODE ? await ensureTunnel() : '';
  if(STATIC_MODE && !base){ loadDrivers(); return; }
  try{
    await fetch(base + '/api/drivers_set?driver=' + encodeURIComponent(name) + '&scattered=' + (now?'1':'0'), {method:'POST'});
  }catch(e){ alert('保存失败，请重试'); }
  loadDrivers();
}
async function storeRoute(btn){
  const driver = btn.dataset.driver;
  if(!driver) return;
  const base = STATIC_MODE ? await ensureTunnel() : '';
  if(STATIC_MODE && !base){ alert('隧道入口未就绪，暂时无法获取门店排序。'); return; }
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '计算中…';
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 90000);
    const r = await fetch(base + '/api/store_route?driver=' + encodeURIComponent(driver),
      {signal: ctrl.signal}).finally(()=>clearTimeout(timer));
    const j = await r.json();
    if(!j.ok){ alert('门店排序失败：' + (j.msg || '未知错误')); return; }
    document.getElementById('depart-title').textContent = '门店排序 · ' + driver;
    document.getElementById('depart-meta').textContent =
      `在途 ${j.count} 店 · 直线全程约 ${j.total_km} 公里 · 起点：马鞍山顺丰丰泰产业园` +
      (j.missing && j.missing.length ? ` · ⚠️${j.missing.length} 家无坐标排最后` : '');
    document.getElementById('depart-text').value = j.text;
    document.getElementById('depart-modal').classList.add('show');
  }catch(e){
    const detail = (e && e.name === 'AbortError') ? '请求超时' : ((e && e.message) || String(e));
    alert('门店排序失败：' + detail);
  }finally{
    btn.disabled = false; btn.textContent = old;
  }
}
async function departInfo(btn){
  const driver = btn.dataset.driver;
  if(!driver) return;
  const base = STATIC_MODE ? await ensureTunnel() : '';
  if(STATIC_MODE && !base){ alert('隧道入口未就绪，暂时无法获取发车信息。'); return; }
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '查询中…';
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 60000);
    const r = await fetch(base + '/api/departure?driver=' + encodeURIComponent(driver),
      {signal: ctrl.signal}).finally(()=>clearTimeout(timer));
    const j = await r.json();
    if(!j.ok){ alert('获取发车信息失败：' + (j.msg || '未知错误')); return; }
    document.getElementById('depart-title').textContent = '发车信息 · ' + driver;
    document.getElementById('depart-meta').textContent =
      `运输中 ${j.orders} 单 · ${j.date}` + (j.km ? ` · 最低 ${j.km}` : '');
    document.getElementById('depart-text').value = j.text;
    document.getElementById('depart-modal').classList.add('show');
  }catch(e){
    const detail = (e && e.name === 'AbortError') ? '请求超时' : ((e && e.message) || String(e));
    alert('获取发车信息失败：' + detail);
  }finally{
    btn.disabled = false; btn.textContent = old;
  }
}
function closeDepartModal(){
  document.getElementById('depart-modal').classList.remove('show');
}
function copyDepartText(btn){
  copyText(document.getElementById('depart-text').value, btn, '复制');
}

async function runTask(tid, isRetry){
  if(running) return;
  // 静态镜像（Pages）：经隧道转发到本机执行；隧道未开启则提示
  const base = STATIC_MODE ? await ensureTunnel() : '';
  if(STATIC_MODE && !base){
    alert('隧道入口未就绪，暂时不能在网页上手动更新。\n页面仍显示最近一次同步的数据；Mac 上开启看板与隧道后即可恢复。');
    return;
  }
  running = true;
  document.querySelectorAll('.btn').forEach(b=>b.disabled=true);
  const sel = document.getElementById('carrier-sel');
  if(sel) sel.disabled = true;
  const btn = document.getElementById('btn-'+tid);
  const LBL = {'1':'任务更新','2':'待拣更新','3':'集货位更新'};
  const old = tid==='all' ? '⟳ 待拣+集货更新' : (LBL[tid]||('更新任务'+tid));
  if(btn) btn.innerHTML = '<span class="spin"></span>更新中…';
  try{
    let url = base + '/api/run?task='+tid;
    if(tid==='1' || tid==='all'){
      const cv = sel ? sel.value : 'all';
      url += '&carrier='+encodeURIComponent(cv);
    }
    // 超时保护：请求卡死时 3 分钟自动中断，避免 running 卡住导致按钮永久失效
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 180000);
    const r = await fetch(url, {method:'POST', signal: ctrl.signal}).finally(()=>clearTimeout(timer));
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    await fetchDriversMap();   // 任务更新可能新增司机，先刷新名单再渲染（托盘车过滤用）
    render(j.data);
    const box = document.getElementById('log-box'), pre = document.getElementById('log-pre');
    pre.textContent = (j.ok?'✅ 执行完成\n':'❌ 执行失败\n') + (j.log||'');
    box.style.display = 'block';
    if(btn) btn.innerHTML = old;
    if(document.getElementById('tab-drivers').classList.contains('active')) loadDrivers();
  }catch(e){
    // 静态镜像下失败常见原因：内存里的隧道地址已过期（隧道重启后地址会变）
    // → 清缓存重取 tunnel_url.js，地址变了就自动重试一次；地址没变才弹提示
    if(STATIC_MODE && !isRetry && LIVE_URL){
      const oldUrl = LIVE_URL;
      LIVE_URL = '';
      const nb = await ensureTunnel();
      if(nb && nb !== oldUrl) return runTask(tid, true);
    }
    const detail = (e && e.name === 'AbortError')
      ? '请求超过 3 分钟未响应，已中断。任务可能仍在 Mac 上后台执行，稍后刷新页面查看结果。'
      : (e && e.message) || String(e);
    alert(STATIC_MODE
      ? '更新失败：'+detail+'\n（本机不在线或隧道已断开时会出现此提示；页面仍显示最近一次同步的数据）'
      : '请求失败: '+detail);
    if(btn) btn.innerHTML = old;
  }finally{
    running = false;
    document.querySelectorAll('.btn').forEach(b=>b.disabled=false);
    const s = document.getElementById('carrier-sel');
    if(s) s.disabled = false;
  }
}

load();

fetchDriversMap().then(()=>{ if(LAST) render(LAST); });
// 不做任何自动刷新：本机看板手动更新，Pages 读取同步过来的快照
</script>
