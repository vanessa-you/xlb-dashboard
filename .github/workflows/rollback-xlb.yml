name: xlb-server-ops
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy dist to server
        env:
          PASS: ${{ secrets.XLB_SERVER_PASS }}
        run: |
          set -e
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          SSHOPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=20"
          sshpass -p "$PASS" scp $SSHOPTS .deploy-dist/index.html root@47.96.157.244:/var/www/xlb-dashboard/index.html
          for f in .deploy-dist/index-*.js .deploy-dist/index-*.css .deploy-dist/route-board.html .deploy-dist/store-data.json; do
            if [ -e "$f" ]; then
              case "$f" in
                */index-*.js|*/index-*.css) DEST=/var/www/xlb-dashboard/assets/ ;;
                *) DEST=/var/www/xlb-dashboard/ ;;
              esac
              sshpass -p "$PASS" scp $SSHOPTS "$f" root@47.96.157.244:$DEST
            fi
          done
          sshpass -p "$PASS" ssh $SSHOPTS root@47.96.157.244 'md5sum /var/www/xlb-dashboard/index.html /var/www/xlb-dashboard/assets/index-iOB3K3r3.js; echo DEPLOY_DONE'
      - name: Cleanup deploy artifacts
        run: |
          git config user.email ops@xlb.local && git config user.name xlb-ops
          git rm -rq .deploy-dist && git commit -qm "chore: cleanup deploy artifacts" && git push -q
          echo CLEANUP_DONE
