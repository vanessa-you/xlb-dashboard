name: sync-dashboard
on:
  # 【2026-10-17 用户要求】取消每 5 分钟定时拉数：只有手动点看板按钮才更新数据
  workflow_dispatch: {}      # 仅支持手动/按钮触发
permissions:
  contents: write
concurrency:
  group: sync-dashboard      # 同组串行排队，避免两个 run 同时登录（防风控/超时）
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # 关键修复（2026-10-13）：凭证跨 run 复用。
      # 之前每个 run 都拿静态 secret 里的过期 AT 探活 → 每次都现场密码登录，
      # 而登录接口从海外 runner 访问国内偶发超时 → run 失败率高。
      # 现在把 auth.json 缓存起来，AT 有效期约 1 天，绝大多数 run 直接命中、跳过登录。
      - name: 恢复凭证缓存
        id: auth_cache
        uses: actions/cache@v4
        with:
          path: auth.json
          key: xlb-auth-${{ github.run_id }}
          restore-keys: |
            xlb-auth-
      - name: 拉取三任务数据
        env:
          XLB_AUTH_B64: ${{ secrets.XLB_AUTH_B64 }}
          # 密码登录自愈：仅在缓存凭证失效时才登录（带 3 次重试）
          XLB_ACCOUNT: ${{ secrets.XLB_ACCOUNT }}
          XLB_COMPANY_ID: ${{ secrets.XLB_COMPANY_ID }}
          XLB_PASSWORD: ${{ secrets.XLB_PASSWORD }}
          TZ: Asia/Shanghai
        run: python cloud_run.py
      - name: 提交数据快照
        run: |
          git config user.name "xlb-cloud"
          git config user.email "xlb-cloud@users.noreply.github.com"
          # 【2026-10-15 修复】此前用 git pull --rebase 推送，一旦 data_task*.json 与远端
          # 版本冲突，rebase 就卡住，5 次重试全部失败（日志 Could not apply …）。
          # 改为：先备份本次新拉的数据 → 重置到远端最新 → 只把数据文件覆盖回来提交。
          # 这样提交永远是基于 origin/main 的干净增量，不会有冲突，也不会回退别人的改动。
          mkdir -p /tmp/xlbdata
          cp data_task1.json data_task2.json data_task3.json /tmp/xlbdata/
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset --hard -q origin/main
            cp /tmp/xlbdata/data_task1.json /tmp/xlbdata/data_task2.json /tmp/xlbdata/data_task3.json .
            git add data_task1.json data_task2.json data_task3.json
            if git diff --cached --quiet; then
              echo "数据无变化，跳过提交"
              exit 0
            fi
            git commit -q -m "data: $(TZ=Asia/Shanghai date +%FT%T)"
            if git push -q origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送失败，5 秒后重试…"
            sleep 5
          done
          echo "推送重试多次仍失败" >&2
          exit 1
