name: sync-dashboard
on:
  schedule:
    - cron: '*/5 * * * *'   # 每5分钟云端拉一次最新数据
  workflow_dispatch: {}      # 支持手动触发
permissions:
  contents: write
concurrency:
  group: sync-dashboard      # 同组串行排队，避免两个 run 同时登录（防风控/超时）
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # 关键修复（2026-10-13）：凭证跨 run 复用。
      # 之前每个 run 都拿静态 secret 里的过期 AT 探活 → 每次都现场密码登录，
      # 而登录接口从海外 runner 访问国内偶发超时 → run 失败率高。
      # 现在把 auth.json 缓存起来，AT 有效期约 1 天，绝大多数 run 直接命中、跳过登录。
      - name: 恢复凭证缓存
        id: auth_cache
        uses: actions/cache@v4
        with:
          path: auth.json
          key: xlb-auth-${{ github.run_id }}
          restore-keys: |
            xlb-auth-
      - name: 拉取三任务数据
        env:
          XLB_AUTH_B64: ${{ secrets.XLB_AUTH_B64 }}
          # 密码登录自愈：仅在缓存凭证失效时才登录（带 3 次重试）
          XLB_ACCOUNT: ${{ secrets.XLB_ACCOUNT }}
          XLB_COMPANY_ID: ${{ secrets.XLB_COMPANY_ID }}
          XLB_PASSWORD: ${{ secrets.XLB_PASSWORD }}
          TZ: Asia/Shanghai
        run: python cloud_run.py
      - name: 提交数据快照
        run: |
          git config user.name "xlb-cloud"
          git config user.email "xlb-cloud@users.noreply.github.com"
          git add data_task1.json data_task2.json data_task3.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Shanghai date +%FT%T)"
          # 【2026-10-15】并发冲突修复：本机看门狗/手动推送可能同时提交（如 tunnel_url.js），
          # 直接 push 会被 rejected(fetch first) 导致整轮失败 → 改为 rebase 拉取后重试推送
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送失败，5 秒后重试…"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "推送重试多次仍失败" >&2
          exit 1
